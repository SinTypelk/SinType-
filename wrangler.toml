# Cloudflare Pages — static output from TanStack Start (prerendered routes).
#
# Build:  npm run build
# Deploy: npm run deploy:cf
#         (or: npx wrangler pages deploy)
#
# Do NOT use `wrangler deploy` — that targets a Worker entry (workers-site/index.js).
name = "sintype-website"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist/client"
