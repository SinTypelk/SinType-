# Cloudflare Workers — static TanStack Start output (prerendered + SPA fallback).
#
# Workers Builds (recommended):
#   Build:  npm run build
#   Deploy: npx wrangler deploy   (default; uses CI credentials — no Pages API token)
#
# Do NOT use `wrangler pages deploy` on Workers Builds unless CLOUDFLARE_API_TOKEN
# includes Account → Cloudflare Pages → Edit.
name = "sintype"
compatibility_date = "2024-01-01"

[assets]
directory = "./dist/client"
not_found_handling = "single-page-application"
